<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume Analyzer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container py-4">
    <header class="mb-4">
      <h1 class="h3 mb-1">Resume Analyzer</h1>
      <p class="text-muted mb-0">Paste your resume, add a job description if you have one, and get a score with clear fixes.</p>
    </header>

    <div class="row g-4">
      <section class="col-lg-5">
        <form id="form">
          <label for="resume" class="form-label fw-semibold">Your resume</label>
          <textarea id="resume" class="form-control mb-2" rows="12" placeholder="Paste your resume text here" required></textarea>
          <input id="file" type="file" accept=".txt,.md" class="form-control form-control-sm mb-3">

          <label for="jd" class="form-label fw-semibold">Job description <span class="text-muted fw-normal">(optional)</span></label>
          <textarea id="jd" class="form-control mb-3" rows="5" placeholder="Paste the job description to check keyword match"></textarea>

          <button id="btn" class="btn btn-primary w-100" type="submit">Analyze resume</button>
        </form>
      </section>

      <section class="col-lg-7">
        <div id="empty" class="panel text-muted">Your analysis will appear here.</div>
        <div id="error" class="alert alert-danger d-none"></div>
        <div id="result" class="d-none">
          <div class="panel d-flex align-items-center gap-3 mb-3">
            <div id="ring" class="ring"><span id="score">0</span></div>
            <p id="summary" class="mb-0"></p>
          </div>
          <div class="row g-3">
            <div class="col-md-6"><div class="panel h-100"><h2 class="h6">Strengths</h2><ul id="strengths"></ul></div></div>
            <div class="col-md-6"><div class="panel h-100"><h2 class="h6">Weaknesses</h2><ul id="weaknesses"></ul></div></div>
            <div class="col-12"><div class="panel"><h2 class="h6">Missing keywords</h2><div id="keywords" class="d-flex flex-wrap gap-2"></div></div></div>
            <div class="col-12"><div class="panel"><h2 class="h6">How to improve</h2><ul id="suggestions" class="mb-0"></ul></div></div>
          </div>
        </div>
      </section>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
